name: DarkTunnel APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK (without auto-actions package manager issue)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK packages with License acceptance
      - name: Install Android SDK packages
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a43b680ff14e7d95085463b247437be53" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      # 5. Download Gradle directly
      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      # 6. Check Java and Gradle
      - name: Check build tools
        run: |
          java -version
          gradle -version

      # 7. Build APK WITHOUT gradlew
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
